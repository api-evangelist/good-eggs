name: Good Eggs
description: 'Good Eggs is an online grocery marketplace founded in 2011 that delivers
  "absurdly fresh" groceries, meal kits, and locally sourced food to homes across the
  West Coast of the United States, primarily the San Francisco Bay Area and Southern
  California. The company curates a marketplace of over 6,000 items from local farms,
  ranches, fisheries, and independent food makers, and operates its own fulfillment
  and same-day/next-day delivery logistics. Good Eggs is a consumer-facing e-commerce
  and delivery business; it maintains a verified public GitHub organization for its
  engineering open-source and internal tooling but does not publish a public developer
  API, SDK, or partner integration program. This profile was added to the API Evangelist
  network as a portfolio-company lead (GV, Index Ventures, Obvious Ventures) and enriched
  with the company''s real public web properties.'
